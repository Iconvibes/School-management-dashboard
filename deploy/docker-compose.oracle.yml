# EduTrack — Oracle Cloud Free Tier (single-node)
#
# Runs app + MongoDB + Redis + Caddy on ONE ARM Ampere instance.
# For 200 beta testers — all services colocated, zero cold starts.
#
# Usage:
#   1. Copy .env.oracle to .env and fill in secrets
#   2. docker compose -f deploy/docker-compose.oracle.yml up -d
#   3. docker compose -f deploy/docker-compose.oracle.yml exec app npm run ensure-indexes

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/edutrack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATA_ENC_KEY: ${DATA_ENC_KEY:?Set DATA_ENC_KEY in .env}
      NODE_ENV: production
      MONGODB_POOL_SIZE: "25"
      UV_THREADPOOL_SIZE: "8"
      RUN_JOBS: primary
      SEED_DEMO_SCHOOL: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
